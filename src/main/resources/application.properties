spring.application.name=SpotifyIndiano
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/musica
spring.datasource.username=root
spring.datasource.password=

# ... eventuali altre proprietà ...

# Fail fast: valida che le colonne esistano e che i tipi combacino
spring.jpa.hibernate.ddl-auto=validate

# Utile per capire quale query sta fallendo (DEV)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# SOLO PER SVILUPPO: include dettagli dell'errore nella risposta HTML (/error)
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-exception=true
spring.web.error.include-stacktrace=always