<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpotifyIndiano - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* --- 1. VARIABILI E RESET --- */
    :root {
      --bg-dark: #09090b;
      --bg-sidebar: #000000;
      --primary: #1db954;
      --primary-hover: #1ed760;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    /* --- 2. LAYOUT PRINCIPALE --- */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* --- 3. SIDEBAR --- */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      padding: 24px 12px;
      border-right: 1px solid #27272a;
      flex-shrink: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px 32px;
    }

    .logo-icon svg { width: 32px; height: 32px; fill: var(--primary); }
    .logo-text { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }

    .nav-section { margin-bottom: 24px; }
    .nav-section-title {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-left: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: var(--transition);
      font-size: 0.9rem;
    }

    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    .nav-item:hover, .nav-item.active { color: var(--text-main); background-color: #27272a; }
    .nav-item.active { color: var(--primary); }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid #27272a;
    }

    /* --- 4. MAIN CONTENT AREA --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: linear-gradient(to bottom, #1e1e24 0%, #09090b 40%);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      position: sticky;
      top: 0;
      background-color: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    /* --- 5. TABELLE E CONTENT --- */
    .content-area { padding: 32px; }
    .page-title { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .page-subtitle { color: var(--text-muted); margin-bottom: 24px; }

    .table-wrap {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
    .table th {
      padding: 12px 16px;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      border-bottom: 1px solid #27272a;
    }

    .table td { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .table tr:hover { background-color: rgba(255,255,255,0.05); }

    /* --- 6. UTILITY COMPONENTS --- */
    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      background: #27272a;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .button {
      padding: 8px 16px;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: var(--transition);
    }

    .button-primary { background: var(--primary); color: black; }
    .button-primary:hover { background: var(--primary-hover); transform: scale(1.05); }
    .button-ghost { background: transparent; color: white; border: 1px solid #3f3f46; }
    .button-ghost:hover { background: rgba(255,255,255,0.1); }
    .button-sm { font-size: 0.8rem; padding: 6px 12px; }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #18181b;
      padding: 8px 12px;
      border-radius: 50px;
      text-decoration: none;
      color: white;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      background: var(--primary);
      color: black;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .muted { color: var(--text-muted); font-size: 0.875rem; }

    /* --- 7. RESPONSIVE MOBILE --- */
    @media (max-width: 768px) {
      .sidebar { display: none; } /* Senza JS, la sidebar viene nascosta su mobile per non bloccare il contenuto */
      .content-area { padding: 16px; }
      .top-header { padding: 12px 16px; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.65 14.65c-.18.28-.56.38-.84.2-2.3-1.4-5.2-1.72-8.6-.94-.33.08-.65-.13-.73-.45-.08-.33.13-.65.45-.73 3.72-.86 6.92-.49 9.56 1.1.28.18.38.56.16.82zm1.23-2.75c-.23.35-.7.47-1.05.24-2.63-1.62-6.63-2.09-9.74-1.14-.4.12-.82-.1-.94-.5-.12-.4.1-.82.5-.94 3.55-1.08 7.95-.56 11.05 1.3.35.23.47.7.18 1.04zm.1-2.86c-3.15-1.87-8.36-2.04-11.36-1.13-.47.14-.97-.13-1.11-.6-.14-.47.13-.97.6-1.11 3.45-1.05 9.17-.85 12.83 1.32.43.25.57.82.32 1.25-.25.43-.82.57-1.28.27z"/></svg>
      </div>
      <span class="logo-text">SpotifyIndiano</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Menu</div>
        <a th:href="@{/}" class="nav-item active">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a th:href="@{/playlist}" th:if="${session.utente != null}" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <span>Le mie playlist</span>
        </a>
      </div>

      <div class="nav-section" th:if="${session.utente != null && session.utente.admin}">
        <div class="nav-section-title">Amministrazione</div>
        <a th:href="@{/admin/brani}" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
          <span>Gestione Brani</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div th:if="${session.utente != null}">
        <a th:href="@{/logout}" class="user-menu">
          <div class="user-avatar" th:text="${#strings.substring(session.utente.nomeUtente, 0, 1).toUpperCase()}">U</div>
          <span class="user-name" th:text="${session.utente.nomeUtente}">Utente</span>
        </a>
      </div>
      <div th:if="${session.utente == null}">
        <a th:href="@{/login}" class="button button-primary" style="width: 100%; justify-content: center;">Accedi</a>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div></div>
      <div class="header-actions">
        <a th:href="@{/signup}" th:if="${session.utente == null}" class="button button-ghost button-sm" style="margin-right: 8px;">Registrati</a>
        <a th:href="@{/login}" th:if="${session.utente == null}" class="button button-primary button-sm">Accedi</a>
        <a th:href="@{/logout}" th:if="${session.utente != null}" class="button button-ghost button-sm">Esci</a>
      </div>
    </header>

    <div class="content-area">
      <h1 class="page-title">Catalogo brani</h1>
      <p class="page-subtitle">Sfoglia i brani disponibili. Accedi per creare le tue playlist.</p>

      <div class="table-wrap">
        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Titolo</th>
            <th>Artista/i</th>
            <th>Durata</th>
            <th>Generi</th>
            <th>YouTube</th>
            <th>MP4</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="brano : ${brani}">
            <td th:text="${brano.id}" class="muted">1</td>
            <td><strong th:text="${brano.titolo}">Titolo</strong></td>
            <td>
              <span th:if="${#lists.isEmpty(brano.autori)}" class="muted">Sconosciuto</span>
              <span th:each="a, i : ${brano.autori}" th:text="${a.nome} + ${!i.last ? ', ' : ''}"></span>
            </td>
            <td th:text="${brano.durata}">00:00:00</td>
            <td>
              <div class="pills">
                <span class="pill" th:each="g : ${brano.generi}" th:text="${g.nome}">Genere</span>
              </div>
            </td>
            <td><a th:href="${brano.link_yt}" target="_blank" class="button button-sm button-ghost">Link</a></td>
            <td>
              <a th:href="${brano.link_mp4}" target="_blank" th:if="${brano.link_mp4 != null}" class="button button-sm button-ghost">Play</a>
              <span th:if="${brano.link_mp4 == null}" class="muted">-</span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
</body>
</html>
