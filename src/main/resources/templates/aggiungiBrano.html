<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpotifyIndiano - Aggiungi Brano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* --- 1. VARIABILI E RESET --- */
    :root {
      --bg-dark: #09090b;
      --bg-sidebar: #000000;
      --primary: #1db954;
      --danger: #e22134;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --radius: 12px;
      --transition: all 0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

    /* --- 2. LAYOUT --- */
    .app-container { display: flex; width: 100vw; height: 100vh; }

    .sidebar { width: 260px; background: #000; padding: 24px 12px; border-right: 1px solid #27272a; flex-shrink: 0; }
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: linear-gradient(to bottom, #1e1e24 0%, #09090b 40%); }

    /* --- 3. FORM STYLING --- */
    .content-area { padding: 40px; }
    .card { background: rgba(255, 255, 255, 0.02); padding: 32px; border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.05); max-width: 700px; margin: 0 auto; }

    .form-grid { display: flex; flex-direction: column; gap: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-label { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }

    .input, .select {
      background-color: #18181b; border: 1px solid #3f3f46; border-radius: 8px;
      padding: 12px 16px; color: white; font-size: 1rem; width: 100%; transition: var(--transition);
    }

    .input:focus, .select:focus { outline: none; border-color: var(--primary); background: #1f1f23; }

    /* Validazione Visiva */
    .input:invalid:not(:placeholder-shown) { border-color: var(--danger); }
    .input:valid:not(:placeholder-shown) { border-color: var(--primary); }

    /* Multi-select Styling */
    select[multiple].select {
      height: auto; min-height: 140px; padding: 8px; background-image: none;
    }
    select[multiple].select option {
      padding: 10px 14px; border-radius: 6px; margin-bottom: 4px; cursor: pointer;
    }
    select[multiple].select option:checked {
      background: var(--primary) linear-gradient(0deg, var(--primary) 0%, var(--primary) 100%);
      color: black; font-weight: 700;
    }

    /* --- 4. NAV & BUTTONS --- */
    .nav-item { display: flex; align-items: center; gap: 16px; padding: 10px 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; border-radius: 8px; margin-bottom: 4px; }
    .nav-item.active { color: var(--primary); background: #27272a; }
    .nav-item svg { width: 24px; fill: currentColor; }

    .flex-between { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }

    .button { padding: 12px 24px; border-radius: 50px; font-weight: 700; cursor: pointer; border: none; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: var(--transition); }
    .button-primary { background: var(--primary); color: black; }
    .button-primary:hover { transform: scale(1.03); background: #1ed760; }
    .button-ghost { color: var(--text-muted); border: 1px solid #3f3f46; }
    .button-ghost:hover { background: rgba(255, 255, 255, 0.05); color: white; }

    .muted { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    @media (max-width: 768px) { .sidebar { display: none; } .content-area { padding: 20px; } }
  </style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar">
    <div class="sidebar-logo" style="margin-bottom: 32px; padding-left: 12px;">
      <span style="color: var(--primary); font-size: 1.5rem; font-weight: 800;">SpotifyIndiano</span>
    </div>
    <nav>
      <div class="nav-section">
        <a th:href="@{/}" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
      </div>
      <div class="nav-section" style="margin-top: 24px;">
        <div style="color: var(--text-muted); font-size: 0.7rem; font-weight: 700; margin-bottom: 12px; padding-left: 12px; text-transform: uppercase;">Amministrazione</div>
        <a th:href="@{/admin/brani}" class="nav-item active">
          <svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
          <span>Gestione Brani</span>
        </a>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <header style="padding: 16px 40px; display: flex; justify-content: flex-end;">
      <a th:href="@{/logout}" class="button button-ghost" style="padding: 6px 16px; font-size: 0.8rem;">Esci</a>
    </header>

    <div class="content-area">
      <div class="card">
        <header style="margin-bottom: 24px;">
          <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 4px;">Aggiungi Nuovo Brano</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Popola il catalogo musicale della piattaforma.</p>
        </header>

        <form th:action="@{/admin/brani/aggiungi}" method="post" class="form-grid">
          <div class="form-group">
            <label class="form-label">Titolo</label>
            <input type="text" name="titolo" class="input" required placeholder="Es. Starboy" />
          </div>

          <div class="form-group">
            <label class="form-label">Durata (HH:mm:ss)</label>
            <input type="text" name="durata" class="input" required placeholder="00:03:50" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}" />
          </div>

          <div class="form-group">
            <label class="form-label">Link YouTube</label>
            <input type="url" name="link_yt" class="input" required placeholder="https://www.youtube.com/watch?v=..." />
          </div>

          <div class="form-group">
            <label class="form-label">Link MP4 (Opzionale)</label>
            <input type="url" name="link_mp4" class="input" placeholder="https://cdn.music.com/file.mp4" />
          </div>

          <div class="form-group">
            <label class="form-label">Seleziona Autori</label>
            <select name="idAutori" class="select" multiple required>
              <option th:each="a : ${autori}" th:value="${a.id}" th:text="${a.nome}">The Weeknd</option>
            </select>
            <p class="muted">Tieni premuto Ctrl (o Cmd) per selezioni multiple.</p>
          </div>

          <div class="form-group">
            <label class="form-label">Seleziona Generi</label>
            <select name="idGeneri" class="select" multiple required>
              <option th:each="g : ${generi}" th:value="${g.id}" th:text="${g.nome}">R&B</option>
            </select>
            <p class="muted">Puoi scegliere più generi per ogni brano.</p>
          </div>

          <div class="flex-between">
            <a th:href="@{/admin/brani}" class="button button-ghost">Annulla</a>
            <button type="submit" class="button button-primary">
              Salva Brano
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
