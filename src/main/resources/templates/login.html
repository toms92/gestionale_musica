<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpotifyIndiano - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* --- 1. VARIABILI E SFONDO AVANZATO --- */
    :root {
      --bg-dark: #09090b;
      --card-bg: #18181b;
      --primary: #1db954;
      --primary-hover: #1ed760;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --danger: #ef4444;
      --input-bg: #27272a;
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      /* Gradiente radiale per dare profondità alla pagina */
      background: radial-gradient(circle at top center, #1e1e24 0%, #09090b 100%);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.5;
      padding: 20px;
    }

    /* --- 2. LAYOUT CARD E EFFETTI --- */
    .auth-card {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: var(--radius);
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #27272a;
      transition: var(--transition);
    }

    .auth-card:hover {
      border-color: #3f3f46;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon svg {
      width: 48px;
      height: 48px;
      fill: var(--primary);
      margin-bottom: 1rem;
    }

    .auth-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    /* --- 3. FORM E INPUT --- */
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .input {
      background-color: var(--input-bg);
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: white;
      font-size: 1rem;
      transition: var(--transition);
      width: 100%;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.2);
    }

    /* --- 4. CHECKBOX PERSONALIZZATA --- */
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 0.875rem;
    }

    .checkbox-wrapper input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      background-color: var(--input-bg);
      border: 1px solid #3f3f46;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
    }

    .checkbox-wrapper input[type="checkbox"]:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .checkbox-wrapper input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: black;
      font-size: 12px;
      font-weight: bold;
      left: 3px;
      top: -1px;
    }

    /* --- 5. BOTTONI E ALERT --- */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      text-decoration: none;
    }

    .button-primary { background-color: var(--primary); color: black; }
    .button-primary:hover { background-color: var(--primary-hover); transform: scale(1.02); }

    .button-ghost { background: transparent; color: var(--text-muted); font-size: 0.875rem; }
    .button-ghost:hover { color: var(--text-main); }

    .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.875rem; }
    .alert-error { background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }

    .alert-success {
      background-color: rgba(29, 185, 84, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
      text-align: center;
    }

    .auth-footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      border-top: 1px solid #27272a;
      padding-top: 1.5rem;
    }

    .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .muted { color: var(--text-muted); }
  </style>
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.65 14.65c-.18.28-.56.38-.84.2-2.3-1.4-5.2-1.72-8.6-.94-.33.08-.65-.13-.73-.45-.08-.33.13-.65.45-.73 3.72-.86 6.92-.49 9.56 1.1.28.18.38.56.16.82zm1.23-2.75c-.23.35-.7.47-1.05.24-2.63-1.62-6.63-2.09-9.74-1.14-.4.12-.82-.1-.94-.5-.12-.4.1-.82.5-.94 3.55-1.08 7.95-.56 11.05 1.3.35.23.47.7.18 1.04zm.1-2.86c-3.15-1.87-8.36-2.04-11.36-1.13-.47.14-.97-.13-1.11-.6-.14-.47.13-.97.6-1.11 3.45-1.05 9.17-.85 12.83 1.32.43.25.57.82.32 1.25-.25.43-.82.57-1.28.27z"/>
      </svg>
    </div>
    <h1 class="auth-title">Accedi a SpotifyIndiano</h1>
    <p class="auth-subtitle">Inserisci le tue credenziali per continuare</p>
  </div>

  <div th:if="${param.error}" class="alert alert-error">Nome utente o password non validi.</div>
  <div th:if="${param.logout}" class="alert alert-success">Sei uscito correttamente dal sistema.</div>

  <form th:action="@{/login}" method="post" class="form-grid">
    <div class="form-group">
      <label class="form-label" for="nomeUtente">Nome utente</label>
      <input class="input" type="text" id="nomeUtente" name="nomeUtente" required autofocus placeholder="Inserisci il tuo nome utente" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="input" type="password" id="password" name="password" required placeholder="Inserisci la tua password" />
    </div>

    <div class="form-group">
      <label class="checkbox-wrapper">
        <input type="checkbox" id="remember-me" name="remember-me" />
        <span class="muted">Ricordami</span>
      </label>
    </div>

    <button class="button button-primary" type="submit" style="width: 100%;">
      Accedi
    </button>
  </form>

  <div class="auth-footer">
    Non hai un account? <a th:href="@{/signup}">Registrati</a>
  </div>

  <div style="text-align: center; margin-top: 16px;">
    <a th:href="@{/}" class="button button-ghost button-sm">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="margin-right: 8px;"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Torna alla Home
    </a>
  </div>
</div>
</body>
</html>
