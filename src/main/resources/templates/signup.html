<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpotifyIndiano - Registrazione</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="brand">
        <span class="logo"></span>
        <a th:href="@{/}">SpotifyIndiano</a>
      </div>
      <div class="menu">
        <a th:href="@{/login}">Accedi</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="card" style="max-width:640px; margin:0 auto;">
      <h1 class="page-title">Crea il tuo account</h1>

      <div th:if="${errorMessage}" class="alert error">
        <strong>Errore:</strong> <span th:text="${errorMessage}">Messaggio di errore</span>
      </div>

      <form th:action="@{/signup}" th:object="${utente}" method="post" class="form-grid">
        <input type="hidden" th:field="*{admin}" />

        <div th:if="${#fields.hasAnyErrors()}" class="alert warning">
          <p>Per favore, correggi gli errori nel modulo sottostante.</p>
        </div>

        <div>
          <label for="nomeUtente">Nome utente</label>
          <input class="input" type="text" id="nomeUtente" th:field="*{nomeUtente}" />
          <p th:if="${#fields.hasErrors('nomeUtente')}" th:errors="*{nomeUtente}" class="muted" style="color:#fecaca"></p>
        </div>

        <div>
          <label for="password">Password</label>
          <input class="input" type="password" id="password" th:field="*{password}" />
          <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="muted" style="color:#fecaca"></p>
        </div>

        <div>
          <label for="confirmPassword">Conferma password</label>
          <input class="input" type="password" id="confirmPassword" name="confirmPassword" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input class="input" type="text" id="email" th:field="*{email}" />
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="muted" style="color:#fecaca"></p>
        </div>

        <div class="flex">
          <a class="button ghost" th:href="@{/}">Annulla</a>
          <span class="right"></span>
          <button class="button primary" type="submit">Crea account</button>
        </div>

        <p class="subtitle">Hai già un account? <a th:href="@{/login}">Accedi</a></p>
      </form>
    </div>
  </main>

  <div class="spacer"></div>
</body>
</html>
