<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpotifyIndiano - Errore</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="brand">
        <span class="logo"></span>
        <a th:href="@{/}">SpotifyIndiano</a>
      </div>
      <div class="menu">
        <a th:href="@{/login}">Accedi</a>
        <a th:href="@{/signup}">Registrati</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="card" style="max-width:720px; margin:0 auto;">
      <h1 class="page-title">Ops! Qualcosa è andato storto</h1>
      <p class="subtitle" th:text="${errorMessage != null ? errorMessage : message}">Si è verificato un errore inaspettato.</p>

      <div class="flex">
        <a class="button ghost" href="javascript:history.back()">Torna indietro</a>
        <span class="right"></span>
        <a class="button" th:href="@{/signup}">Registrazione</a>
        <a class="button" th:href="@{/login}">Login</a>
        <a class="button primary" th:href="@{/}">Home</a>
      </div>
    </div>
  </main>

  <div class="spacer"></div>
</body>
</html>
