<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpotifyIndiano - Crea Playlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* --- VARIABILI E BASE --- */
    :root {
      --bg-dark: #09090b;
      --bg-sidebar: #000000;
      --primary: #1db954;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

    /* --- LAYOUT --- */
    .app-container { display: flex; width: 100vw; height: 100vh; }

    /* Sidebar sempre visibile su desktop */
    .sidebar { width: 260px; background: #000; padding: 24px 12px; border-right: 1px solid #27272a; flex-shrink: 0; }
    .nav-item { display: flex; align-items: center; gap: 16px; padding: 10px 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; border-radius: 8px; margin-bottom: 4px; }
    .nav-item.active { color: var(--primary); background: #27272a; }
    .nav-item svg { width: 24px; fill: currentColor; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: linear-gradient(to bottom, #1e1e24 0%, #09090b 100%); }

    /* --- FORM E TABELLA --- */
    .content-area { padding: 40px; }
    .form-grid { display: flex; flex-direction: column; gap: 2rem; }

    .input, .select {
      background-color: #18181b; border: 1px solid #3f3f46; border-radius: 8px;
      padding: 12px 16px; color: white; font-size: 1rem; width: 100%;
    }

    .table-wrap {
      max-height: 450px;
      overflow-y: auto;
      border: 1px solid #27272a;
      border-radius: 8px;
      background: rgba(0,0,0,0.2);
    }

    .table { width: 100%; border-collapse: collapse; text-align: left; }
    .table th { background: #18181b; padding: 12px; position: sticky; top: 0; z-index: 5; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

    /* Feedback visivo riga selezionata (CSS Moderno) */
    .table tbody tr:has(input[type="checkbox"]:checked) {
      background-color: rgba(29, 185, 84, 0.1);
    }

    .flex-between { display: flex; justify-content: space-between; align-items: center; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }

    .button { padding: 12px 24px; border-radius: 50px; font-weight: 700; cursor: pointer; border: none; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .button-primary { background: var(--primary); color: black; }
    .button-secondary { background: #27272a; color: white; }
    .button-ghost { color: var(--text-muted); }

    .pills { display: flex; gap: 4px; }
    .pill { background: #27272a; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; color: var(--text-muted); }
  </style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar">
    <div class="sidebar-logo" style="margin-bottom: 32px; padding-left: 12px;">
      <span style="color: var(--primary); font-size: 1.5rem; font-weight: 800;">SpotifyIndiano</span>
    </div>
    <nav>
      <a th:href="@{/}" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </a>
      <a th:href="@{/playlist}" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span>Le mie playlist</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="content-area">
      <div class="card" style="max-width: 900px; margin: 0 auto;">
        <header style="margin-bottom: 32px;">
          <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 8px;">Crea Playlist</h1>
          <p style="color: var(--text-muted);">Configura la tua nuova raccolta musicale.</p>
        </header>

        <form th:action="@{/playlist/crea}" method="get" style="display: flex; gap: 12px; margin-bottom: 2rem; background: rgba(255,255,255,0.03); padding: 16px; border-radius: 8px;">
          <input class="input" type="text" name="search" th:value="${search}" placeholder="Cerca brani...">
          <select class="select" name="orderBy" style="width: 200px;">
            <option value="">Ordina per...</option>
            <option value="durata_desc" th:selected="${orderBy == 'durata_desc'}">Più lunghi</option>
            <option value="genere" th:selected="${orderBy == 'genere'}">Per Genere</option>
          </select>
          <button class="button button-secondary" type="submit">Filtra</button>
        </form>

        <form th:action="@{/playlist/crea}" method="post" class="form-grid">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label style="font-weight: 600;">Nome Playlist</label>
            <input class="input" type="text" name="nome" required placeholder="Inserisci un titolo...">
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
              <tr>
                <th style="width: 50px;"></th>
                <th>Titolo</th>
                <th>Artista</th>
                <th>Durata</th>
                <th>Generi</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="brano : ${brani}">
                <td style="text-align: center;">
                  <input type="checkbox" name="idBrani" th:value="${brano.id}" th:id="'br_' + ${brano.id}" style="width: 18px; height: 18px; cursor: pointer;">
                </td>
                <td>
                  <label th:for="'br_' + ${brano.id}" th:text="${brano.titolo}" style="cursor:pointer; display: block; font-weight: 600;"></label>
                </td>
                <td th:text="${brano.autori[0].nome}" style="color: var(--text-muted);"></td>
                <td th:text="${brano.durata}" style="color: var(--text-muted);"></td>
                <td>
                  <div class="pills">
                    <span class="pill" th:each="g : ${brano.generi}" th:text="${g.nome}"></span>
                  </div>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="flex-between">
            <a th:href="@{/playlist}" class="button button-ghost">Annulla</a>
            <button type="submit" class="button button-primary">Crea Ora</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
