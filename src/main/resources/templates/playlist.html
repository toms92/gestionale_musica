<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpotifyIndiano - Playlist</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="brand">
        <span class="logo"></span>
        <a th:href="@{/}">SpotifyIndiano</a>
      </div>
      <div class="menu">
        <a th:href="@{/playlist/crea}">Crea playlist</a>
        <a th:href="@{/logout}" class="right">Esci</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <div class="flex">
        <h1 class="page-title">Le tue playlist</h1>
        <a class="button primary right" th:href="@{/playlist/crea}">+ Nuova playlist</a>
      </div>

      <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

      <div th:if="${playlist}">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Durata</th>
                <th>Creata il</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${playlist}">
                <td th:text="${p.nome}">Nome</td>
                <td th:text="${p.durata}">00:00:00</td>
                <td th:text="${#dates.format(p.data_creazione, 'dd/MM/yyyy')}">01/01/2024</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="spacer"></div>
</body>
</html>
