<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpotifyIndiano - Playlist</title>

  <style>
    /* --- 1. VARIABILI E BASE --- */
    :root {
      --bg-dark: #09090b;
      --bg-sidebar: #000000;
      --card-bg: #18181b;
      --card-hover: #27272a;
      --primary: #1db954;
      --primary-hover: #1ed760;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* --- 2. LAYOUT STRUTTURALE --- */
    .app-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
      padding: 24px 12px;
    }

    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 20px;
      background: linear-gradient(to bottom, #1e1e1e 0%, var(--bg-dark) 100%);
    }

    /* --- 3. PLAYLIST GRID VIEW --- */
    .playlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .playlist-card {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      text-decoration: none;
      transition: var(--transition);
      position: relative;
    }

    .playlist-card:hover {
      background-color: var(--card-hover);
    }

    .playlist-card-cover {
      width: 100%;
      aspect-ratio: 1/1;
      background: linear-gradient(135deg, #282828 0%, #121212 100%);
      border-radius: 6px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .playlist-card-cover svg {
      width: 64px;
      height: 64px;
      fill: var(--text-muted);
    }

    /* Bottone Play che appare al passaggio del mouse */
    .playlist-card-play {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 48px;
      height: 48px;
      background-color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
      transition: var(--transition);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    .playlist-card-play svg {
      width: 24px;
      height: 24px;
      fill: black;
    }

    .playlist-card:hover .playlist-card-play {
      opacity: 1;
      transform: translateY(0);
    }

    .playlist-card-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 8px;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-card-meta {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* --- 4. ELEMENTI COMUNI --- */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 24px;
    }

    .page-title { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .page-subtitle { color: var(--text-muted); }

    .button {
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .button-primary { background-color: var(--primary); color: black; }
    .button-primary:hover { transform: scale(1.05); background-color: var(--primary-hover); }

    .alert {
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
    }
    .alert-info { background: rgba(29, 185, 84, 0.1); color: var(--primary); border: 1px solid var(--primary); }

    /* Sidebar Navigation Items */
    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }
    .nav-item:hover, .nav-item.active { color: white; }
    .nav-item svg { width: 24px; height: 24px; fill: currentColor; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.65 14.65c-.18.28-.56.38-.84.2-2.3-1.4-5.2-1.72-8.6-.94-.33.08-.65-.13-.73-.45-.08-.33.13-.65.45-.73 3.72-.86 6.92-.49 9.56 1.1.28.18.38.56.16.82zm1.23-2.75c-.23.35-.7.47-1.05.24-2.63-1.62-6.63-2.09-9.74-1.14-.4.12-.82-.1-.94-.5-.12-.4.1-.82.5-.94 3.55-1.08 7.95-.56 11.05 1.3.35.23.47.7.18 1.04zm.1-2.86c-3.15-1.87-8.36-2.04-11.36-1.13-.47.14-.97-.13-1.11-.6-.14-.47.13-.97.6-1.11 3.45-1.05 9.17-.85 12.83 1.32.43.25.57.82.32 1.25-.25.43-.82.57-1.28.27z"/>
        </svg>
      </div>
      <span class="logo-text" style="font-weight: 800; font-size: 1.2rem;">SpotifyIndiano</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title" style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; padding: 12px;">Menu</div>
        <a th:href="@{/}" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a th:href="@{/playlist}" class="nav-item active">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <span>Le mie playlist</span>
        </a>
      </div>

      <div class="nav-section playlist-section">
        <div class="nav-section-title" style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; padding: 12px;">Le tue playlist</div>
        <a th:href="@{/playlist/crea}" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
          <span>Crea playlist</span>
        </a>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <div class="content-area">
      <div class="card">
        <div class="card-header">
          <div>
            <h1 class="page-title">Le tue playlist</h1>
            <p class="page-subtitle">Gestisci e ascolta le tue playlist personali</p>
          </div>
          <a class="button button-primary" th:href="@{/playlist/crea}">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Nuova playlist
          </a>
        </div>

        <div th:if="${playlist != null && !#lists.isEmpty(playlist)}" class="playlist-grid">
          <a th:each="p : ${playlist}" th:href="@{/playlist/{id}(id=${p.id})}" class="playlist-card">
            <div class="playlist-card-cover">
              <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
              <div class="playlist-card-play">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>
            <div class="playlist-card-title" th:text="${p.nome}">Nome Playlist</div>
            <div class="playlist-card-meta">
              <span th:text="${p.durata}">00:00:00</span> •
              <span th:text="${#dates.format(p.data_creazione, 'dd/MM/yyyy')}">01/01/2024</span>
            </div>
          </a>
        </div>

        <div th:if="${playlist == null || #lists.isEmpty(playlist)}" class="alert alert-info">
          Non hai ancora creato nessuna playlist. Clicca su "Nuova playlist" per iniziare!
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
